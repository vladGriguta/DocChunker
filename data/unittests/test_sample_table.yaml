document: "sample_table.docx"
description: "Tests table processing and context preservation"

# Test cases: search for specific content and verify expected context
test_cases:
  - name: "(1, 1)"
    search_text: "cell (1,1)"
    expected_in_chunk:
      - "Header Row - This cell spans across all four columns and provides a title or summary for the entire table content below."
      - "Merged Vertically"
    expected_metadata:
      node_type: "table_rows"

  - name: "(3,2)"
    search_text: "Cell (3,2)"
    expected_in_chunk:
      - "Header Row - This cell spans across all four columns and provides a title or summary for the entire table content below."
      - "Cell (3,0) begins a new row and"
    expected_metadata:
      node_type: "table_rows"

  - name: "Example Table with Long context"
    search_text: "Example Table with Long context"
    num_chunks: 2
    expected_metadata:
      node_type: "table_rows"
    # The committed sample_table.pdf export is truncated: it contains only the
    # first section (1 page, ends after the merged-cells table). The heading
    # "Example Table with Long context" and its table do not exist in the PDF
    # (verified with both PyMuPDF and PyPDF raw text extraction), so no parser
    # improvement can make this case pass until the PDF export is refreshed
    # from sample_table.docx.
    xfail_pdf: true

# Global expectations for the document
global_checks:
  min_chunks: 1
  max_empty_chunks: 0